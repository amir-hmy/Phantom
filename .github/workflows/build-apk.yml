
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          mkdir -p /tmp/bak
          cp -r lib pubspec.yaml /tmp/bak/

          flutter create --platforms=android --org ir.kashan --project-name kashan_energy .

          rm -rf lib
          cp -r /tmp/bak/lib lib
          cp /tmp/bak/pubspec.yaml pubspec.yaml

          rm -rf test

      - name: Set minSdk 24
        run: |
          f=$(ls android/app/build.gradle*)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$f"
          grep -n "minSdk" "$f"

      - name: Set app label
        run: |
          sed -i 's/android:label="[^"]*"/android:label="انرژی کاشان"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kashan-energy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
