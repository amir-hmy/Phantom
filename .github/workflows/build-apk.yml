name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # پوشه‌ی android در مخزن نیست؛ اینجا ساخته می‌شود (سورس خودمان حفظ می‌شود)
      - name: Generate Android project
        run: |
          mkdir -p /tmp/bak && cp -r lib pubspec.yaml /tmp/bak/
          flutter create --platforms=android --org ir.kashan --project-name kashan_energy .
          rm -rf lib && cp -r /tmp/bak/lib lib && cp /tmp/bak/pubspec.yaml pubspec.yaml
          rm -rf test

      # حداقل اندروید ۷ (API 24)
      - name: Set minSdk 24
        run: |
          f=$(ls android/app/build.gradle*)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$f"
          grep -n "minSdk" "$f"

      # نام برنامه در لانچر اندروید
      - name: Set app label
        run: sed -i 's/android:label="[^"]*"/android:label="انرژی کاشان"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      # فقط برای گزارش؛ هشدارها ساخت را متوقف نمی‌کنند
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kashan-energy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
